<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monevo — Savings Goals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-viewport">
  <div class="phone-shell">
    <div class="screen-container">
      <div class="notch"></div>
      
      <div class="statusbar">
        <span>9:41</span>
        <span>●●● 100%</span>
      </div>

      <!-- App Header -->
      <div class="app-header">
        <a href="dashboard.html" class="header-back">
          <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="header-title">Savings Goals</div>
        <div class="header-action" onclick="openNewGoalModal()">➕</div>
      </div>

      <div class="main-content" style="gap: 14px;">
        <div class="row">
          <div>
            <div class="h1">Semester Targets</div>
            <div class="sub-text">Build habits for college life</div>
          </div>
          <button class="pill pill-navy card-interactive" onclick="openNewGoalModal()">+ New</button>
        </div>

        <!-- Total Saved Summary Card -->
        <div class="card" style="background: var(--grad); color: #fff; padding: 16px;">
          <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; opacity: 0.85;">Total Saved Toward Goals</div>
          <div class="mono" id="totalSavedDisplay" style="font-size: 26px; font-weight: 700; margin-top: 2px;">$950.00</div>
          <div class="sub-text" style="color: rgba(255,255,255,0.9); margin-top: 4px;">Across 3 active student targets</div>
        </div>

        <!-- Goals List -->
        <div style="display: flex; flex-direction: column; gap: 12px;" id="savingsGoalList">
          <!-- Rendered by JS -->
        </div>

      </div>

      <!-- Bottom Navigation Bar -->
      <div class="tabbar">
        <a href="dashboard.html" class="tab-item" data-tab="home">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span class="tab-lbl">Home</span>
        </a>
        <a href="expenses.html" class="tab-item" data-tab="track">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-6"/></svg>
          <span class="tab-lbl">Track</span>
        </a>
        <a href="budget.html" class="tab-item" data-tab="budget">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span class="tab-lbl">Budget</span>
        </a>
        <a href="analytics.html" class="tab-item" data-tab="insights">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
          <span class="tab-lbl">Insights</span>
        </a>
        <a href="profile.html" class="tab-item" data-tab="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="tab-lbl">Profile</span>
        </a>
      </div>

      <!-- Deposit Modal -->
      <div class="modal-overlay" id="depositModal">
        <div class="modal-card">
          <div class="row">
            <div class="h2" id="depositModalTitle">Add Funds to Goal</div>
            <span onclick="closeDepositModal()" style="cursor: pointer; font-size: 16px;">✕</span>
          </div>
          <div class="input-group">
            <label class="input-label">Deposit Amount ($)</label>
            <input type="number" step="5" id="depositAmountInput" class="input-field mono" value="25.00">
          </div>
          <button class="btn-grad" onclick="confirmDeposit()">✓ Add Deposit</button>
        </div>
      </div>

      <!-- New Goal Modal -->
      <div class="modal-overlay" id="newGoalModal">
        <div class="modal-card">
          <div class="row">
            <div class="h2">Create New Goal</div>
            <span onclick="closeNewGoalModal()" style="cursor: pointer; font-size: 16px;">✕</span>
          </div>
          <div class="input-group">
            <label class="input-label">Goal Title</label>
            <input type="text" id="newGoalTitle" class="input-field" placeholder="e.g. Study Abroad, Graduation Suit">
          </div>
          <div class="input-group">
            <label class="input-label">Target Amount ($)</label>
            <input type="number" id="newGoalTarget" class="input-field mono" placeholder="500.00">
          </div>
          <div class="input-group">
            <label class="input-label">Target Months</label>
            <input type="number" id="newGoalMonths" class="input-field" placeholder="4" value="4">
          </div>
          <button class="btn-grad" onclick="saveNewGoal()">+ Create Goal</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  let selectedGoalId = null;

  function renderGoals() {
    const goals = MonevoStore.state.savingsGoals;
    const container = document.getElementById('savingsGoalList');
    let totalSaved = 0;

    let html = '';
    goals.forEach(g => {
      totalSaved += Number(g.currentAmount);
      const pct = Math.min(100, Math.round((g.currentAmount / g.targetAmount) * 100));
      const circumference = 145; // 2 * pi * 23
      const offset = circumference - (circumference * pct / 100);

      html += `
        <div class="card card-interactive" onclick="openDepositModal('${g.id}', '${g.title}')" style="display: flex; gap: 14px; align-items: center; padding: 14px;">
          <svg width="56" height="56" viewBox="0 0 56 56" style="flex: none;">
            <defs>
              <linearGradient id="goalGrad_${g.id}" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0%" stop-color="#2ECC71"/>
                <stop offset="100%" stop-color="#2E86DE"/>
              </linearGradient>
            </defs>
            <circle cx="28" cy="28" r="23" stroke="var(--border-light)" stroke-width="6" fill="none"/>
            <circle cx="28" cy="28" r="23" stroke="url(#goalGrad_${g.id})" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="145" stroke-dashoffset="${offset}" transform="rotate(-90 28 28)"/>
            <text x="28" y="32" text-anchor="middle" font-family="Sora" font-size="11" font-weight="700" fill="var(--text-main)">${pct}%</text>
          </svg>
          <div style="flex: 1;">
            <div style="font-weight: 700; font-size: 13px;">${g.icon || '🎯'} ${g.title}</div>
            <div class="mono sub-text" style="color: var(--text-main); font-weight: 700; margin-top: 2px;">
              ${MonevoUI.formatCurrency(g.currentAmount)} / ${MonevoUI.formatCurrency(g.targetAmount)}
            </div>
            <div class="sub-text" style="color: var(--blue); font-weight: 600; margin-top: 2px;">
              ~${g.targetMonths} months left · Tap to deposit
            </div>
          </div>
          <span style="font-size: 16px; color: var(--text-muted);">➕</span>
        </div>
      `;
    });

    container.innerHTML = html;
    document.getElementById('totalSavedDisplay').textContent = MonevoUI.formatCurrency(totalSaved);
  }

  function openDepositModal(id, title) {
    selectedGoalId = id;
    document.getElementById('depositModalTitle').textContent = `Deposit to "${title}"`;
    document.getElementById('depositModal').classList.add('open');
  }

  function closeDepositModal() {
    document.getElementById('depositModal').classList.remove('open');
  }

  function confirmDeposit() {
    const amt = parseFloat(document.getElementById('depositAmountInput').value);
    if (!amt || amt <= 0) {
      MonevoUI.showToast('Please enter a valid amount', '⚠️');
      return;
    }
    MonevoStore.addGoalDeposit(selectedGoalId, amt);
    closeDepositModal();
    MonevoUI.showToast(`Deposited ${MonevoUI.formatCurrency(amt)}!`, '🎉');
    renderGoals();
  }

  function openNewGoalModal() {
    document.getElementById('newGoalModal').classList.add('open');
  }

  function closeNewGoalModal() {
    document.getElementById('newGoalModal').classList.remove('open');
  }

  function saveNewGoal() {
    const title = document.getElementById('newGoalTitle').value.trim();
    const target = parseFloat(document.getElementById('newGoalTarget').value);
    const months = parseInt(document.getElementById('newGoalMonths').value) || 3;

    if (!title || !target) {
      MonevoUI.showToast('Please fill in title and target', '⚠️');
      return;
    }

    MonevoStore.addSavingsGoal({
      title: title,
      icon: '🎯',
      currentAmount: 0.00,
      targetAmount: target,
      targetMonths: months
    });

    closeNewGoalModal();
    MonevoUI.showToast('New target created!', '✓');
    renderGoals();
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderGoals();
  });
</script>
</body>
</html>
