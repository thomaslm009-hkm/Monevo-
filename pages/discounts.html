<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monevo — Student Discounts</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#12233F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monevo">
  <link rel="apple-touch-icon" href="../images/icon-192.png">
  <link rel="icon" type="image/png" href="../images/monevo-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-viewport">
  <div class="app-container" style="padding-top: 14px;">

      <!-- App Header -->
      <div class="app-header">
        <a href="dashboard.html" class="header-back">
          <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="header-title">Student Deals</div>
        <div style="width: 36px;"></div>
      </div>

      <div class="main-content" style="gap: 14px;">
        <div class="h1">Exclusive Student Perks</div>

        <!-- Filter Chips -->
        <div class="chip-container" id="dealChips">
          <div class="chip on" onclick="filterDeals('All', this)">All</div>
          <div class="chip" onclick="filterDeals('Food', this)">Food 🍕</div>
          <div class="chip" onclick="filterDeals('Tech', this)">Tech 🎧</div>
          <div class="chip" onclick="filterDeals('Fashion', this)">Fashion 👕</div>
        </div>

        <!-- Verification Banner -->
        <div class="card" style="background: var(--grad-soft); padding: 12px 14px; display: flex; align-items: center; gap: 10px;">
          <div style="font-size: 24px;">🎓</div>
          <div>
            <div style="font-size: 11px; font-weight: 700; color: var(--navy);">Verified Student Member</div>
            <div class="sub-text" style="font-size: 10px;">Connected via alex.rivera@university.edu</div>
          </div>
        </div>

        <!-- Deals List -->
        <div style="display: flex; flex-direction: column; gap: 12px;" id="dealsContainer">
          <!-- Populated by JS -->
        </div>

      </div>

      <!-- Bottom Navigation Bar -->
      <div class="tabbar">
        <a href="dashboard.html" class="tab-item" data-tab="home">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span class="tab-lbl">Home</span>
        </a>
        <a href="expenses.html" class="tab-item" data-tab="track">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-6"/></svg>
          <span class="tab-lbl">Track</span>
        </a>
        <a href="budget.html" class="tab-item" data-tab="budget">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span class="tab-lbl">Budget</span>
        </a>
        <a href="analytics.html" class="tab-item" data-tab="insights">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
          <span class="tab-lbl">Insights</span>
        </a>
        <a href="profile.html" class="tab-item" data-tab="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="tab-lbl">Profile</span>
        </a>
      </div>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  let activeCat = 'All';

  function filterDeals(cat, el) {
    activeCat = cat;
    document.querySelectorAll('#dealChips .chip').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    renderDeals();
  }

  function renderDeals() {
    const list = MonevoStore.state.discounts;
    const container = document.getElementById('dealsContainer');

    const filtered = list.filter(d => {
      if (activeCat === 'All') return true;
      return d.category === activeCat;
    });

    let html = '';
    filtered.forEach(deal => {
      html += `
        <div class="card" style="display: flex; flex-direction: column; gap: 10px; padding: 14px;">
          <div class="row">
            <div style="display: flex; align-items: center; gap: 10px;">
              <div class="icon-badge" style="background: var(--card-subtle);">${deal.icon || '🏷️'}</div>
              <div>
                <div style="font-size: 13px; font-weight: 700;">${deal.brand}</div>
                <div class="sub-text">${deal.category}</div>
              </div>
            </div>
            <div class="pill pill-gold">${deal.discount}</div>
          </div>
          <div class="sub-text" style="line-height: 1.4;">${deal.description}</div>
          <div class="row" style="background: var(--card-subtle); padding: 8px 12px; border-radius: 10px; border: 1px dashed var(--border-light); margin-top: 2px;">
            <div style="font-size: 11px;">Promo Code: <strong class="mono" style="color: var(--blue);">${deal.code}</strong></div>
            <button class="btn-grad" onclick="copyCode('${deal.code}')" style="padding: 6px 12px; font-size: 11px; border-radius: 8px;">
              Copy
            </button>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function copyCode(code) {
    navigator.clipboard.writeText(code);
    MonevoUI.showToast(`Code "${code}" copied to clipboard!`, '📋');
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderDeals();
  });
</script>
</body>
</html>
