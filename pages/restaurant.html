<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monevo — Restaurant Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-viewport">
  <div class="phone-shell">
    <div class="screen-container">
      <div class="notch"></div>
      
      <div class="statusbar">
        <span>9:41</span>
        <span>●●● 100%</span>
      </div>

      <!-- App Header -->
      <div class="app-header">
        <a href="dashboard.html" class="header-back">
          <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="header-title">Campus Eats Finder</div>
        <div style="width: 36px;"></div>
      </div>

      <div class="main-content" style="gap: 14px;">
        <div class="h1">Eat well, spend less</div>

        <!-- Search Bar -->
        <div class="card card-sm" style="display: flex; align-items: center; gap: 8px; padding: 10px 14px;">
          <svg class="ic" style="width: 16px; height: 16px; color: var(--text-muted);" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input type="text" id="restaurantSearchInput" oninput="filterRestaurants()" placeholder="Search nearby student eats..." style="width: 100%; font-size: 12px; color: var(--text-main);">
        </div>

        <!-- Filter Chips -->
        <div class="chip-container" id="filterChips">
          <div class="chip on" onclick="setFilter('all', this)">All</div>
          <div class="chip" onclick="setFilter('$', this)">฿ Under ฿100</div>
          <div class="chip" onclick="setFilter('$$', this)">฿฿ ฿100–฿300</div>
          <div class="chip" onclick="setFilter('deal', this)">🎓 Student Deals</div>
        </div>

        <!-- Restaurant List -->
        <div style="display: flex; flex-direction: column; gap: 12px;" id="restaurantListContainer">
          <!-- Rendered by JS -->
        </div>

      </div>

      <!-- Bottom Navigation Bar -->
      <div class="tabbar">
        <a href="dashboard.html" class="tab-item" data-tab="home">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span class="tab-lbl">Home</span>
        </a>
        <a href="expenses.html" class="tab-item" data-tab="track">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-6"/></svg>
          <span class="tab-lbl">Track</span>
        </a>
        <a href="budget.html" class="tab-item" data-tab="budget">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span class="tab-lbl">Budget</span>
        </a>
        <a href="analytics.html" class="tab-item" data-tab="insights">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
          <span class="tab-lbl">Insights</span>
        </a>
        <a href="profile.html" class="tab-item" data-tab="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="tab-lbl">Profile</span>
        </a>
      </div>

    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  let currentFilter = 'all';

  function setFilter(filter, el) {
    currentFilter = filter;
    document.querySelectorAll('#filterChips .chip').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    filterRestaurants();
  }

  function filterRestaurants() {
    const q = document.getElementById('restaurantSearchInput').value.toLowerCase().trim();
    const list = MonevoStore.state.restaurants;
    const container = document.getElementById('restaurantListContainer');

    const filtered = list.filter(r => {
      const matchQuery = !q || r.name.toLowerCase().includes(q) || r.category.toLowerCase().includes(q);
      let matchFilter = true;
      if (currentFilter === '$') matchFilter = r.price === '$';
      if (currentFilter === '$$') matchFilter = r.price === '$$';
      if (currentFilter === 'deal') matchFilter = !!r.discount;
      return matchQuery && matchFilter;
    });

    let html = '';
    const gradients = [
      'var(--grad)',
      'linear-gradient(135deg, #1C355C, #2E86DE)',
      'linear-gradient(135deg, #F0A93A, #FF6B6B)',
      'linear-gradient(135deg, #9B59B6, #2ECC71)'
    ];

    filtered.forEach((r, idx) => {
      const grad = gradients[idx % gradients.length];
      const isCheap = r.price === '$';
      const badgeColor = isCheap ? '#1E9E56' : '#C13E3E';
      const badgeBg = isCheap ? '#E8FAF0' : '#FDECEC';

      html += `
        <div class="card card-interactive" onclick="MonevoUI.showToast('${r.name}: Show student ID to redeem offer!', '📍')" style="display: flex; gap: 12px; padding: 14px;">
          <div style="width: 54px; height: 54px; border-radius: 14px; background: ${grad}; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; flex: none;">
            ${r.category.includes('Pizza') ? '🍕' : r.category.includes('Asian') ? '🍜' : r.category.includes('Bowls') ? '🥗' : '🥪'}
          </div>
          <div style="flex: 1;">
            <div class="row">
              <span style="font-size: 13px; font-weight: 700;">${r.name}</span>
              <span class="pill" style="background: ${badgeBg}; color: ${badgeColor};">${r.price}</span>
            </div>
            <div class="sub-text" style="margin-top: 2px;">${r.distance} · ${r.category} · ${r.rating}</div>
            ${r.discount ? `
              <div class="pill pill-gold" style="margin-top: 6px;">
                ${r.discount}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    });

    if (filtered.length === 0) {
      html = `<div class="card sub-text" style="text-align: center; padding: 24px;">No restaurants found matching your criteria.</div>`;
    }

    container.innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', () => {
    filterRestaurants();
  });
</script>
</body>
</html>
