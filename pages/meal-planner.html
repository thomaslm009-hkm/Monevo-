<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monevo — Meal Planner</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#12233F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monevo">
  <link rel="apple-touch-icon" href="../images/icon-192.png">
  <link rel="icon" type="image/png" href="../images/monevo-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .day-selector-strip {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }
    .day-btn {
      flex: 1;
      text-align: center;
      padding: 6px 2px;
      border-radius: 12px;
      cursor: pointer;
      background: var(--card);
      border: 1px solid var(--border-light);
      transition: all 0.15s ease;
    }
    .day-btn.active {
      background: var(--grad);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: var(--shadow-sm);
    }
    .day-btn .day-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .day-btn .day-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      margin: 4px auto 0;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="app-viewport">
  <div class="phone-shell">
    <div class="screen-container">
      <div class="notch"></div>
      
      <div class="statusbar">
        <span>9:41</span>
        <span>●●● 100%</span>
      </div>

      <!-- App Header -->
      <div class="app-header">
        <a href="dashboard.html" class="header-back">
          <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="header-title">Meal Planner</div>
        <div class="header-action" onclick="openAddMealModal()">➕</div>
      </div>

      <div class="main-content" style="gap: 14px;">
        <div class="h1">This week's meals</div>

        <!-- 7 Day Strip Selector -->
        <div class="day-selector-strip" id="dayStrip">
          <div class="day-btn" onclick="selectDay('Mon', this)"><div class="day-label">Mon</div><div class="day-dot"></div></div>
          <div class="day-btn active" onclick="selectDay('Tue', this)"><div class="day-label">Tue</div><div class="day-dot"></div></div>
          <div class="day-btn" onclick="selectDay('Wed', this)"><div class="day-label">Wed</div><div class="day-dot"></div></div>
          <div class="day-btn" onclick="selectDay('Thu', this)"><div class="day-label">Thu</div><div class="day-dot"></div></div>
          <div class="day-btn" onclick="selectDay('Fri', this)"><div class="day-label">Fri</div><div class="day-dot"></div></div>
          <div class="day-btn" onclick="selectDay('Sat', this)"><div class="day-label">Sat</div><div class="day-dot"></div></div>
          <div class="day-btn" onclick="selectDay('Sun', this)"><div class="day-label">Sun</div><div class="day-dot"></div></div>
        </div>

        <!-- Daily Meal Budget Card -->
        <div class="card" style="background: var(--grad-soft);">
          <div class="row">
            <div>
              <span class="h2" id="dailyMealTitle">Tuesday meal budget</span>
              <div class="sub-text">Linked to student food cap</div>
            </div>
            <span class="mono" id="dailyMealRatio" style="font-size: 13px; font-weight: 700; color: var(--navy);">฿125.00 / ฿150.00</span>
          </div>
          <div class="bar-track" style="margin-top: 8px;">
            <div class="bar-fill" id="dailyMealFill" style="width: 83%;"></div>
          </div>
        </div>

        <!-- Meal Cards for Selected Day -->
        <div class="row">
          <div class="h2">Planned Meals</div>
          <span class="sub-text" id="mealsDayTag">Tuesday</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;" id="mealsListContainer">
          <!-- Rendered by JS -->
        </div>

        <!-- Quick link to restaurants -->
        <a href="restaurant.html" class="card card-sm card-interactive row" style="background: var(--card-subtle); margin-top: 4px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 18px;">📍</span>
            <div>
              <div style="font-size: 11px; font-weight: 700;">Find Nearby Cheap Eats</div>
              <div class="sub-text" style="font-size: 9px;">Campus student deals under ฿80</div>
            </div>
          </div>
          <span style="font-weight: 700; color: var(--blue); font-size: 14px;">›</span>
        </a>

      </div>

      <!-- Bottom Navigation Bar -->
      <div class="tabbar">
        <a href="dashboard.html" class="tab-item" data-tab="home">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span class="tab-lbl">Home</span>
        </a>
        <a href="expenses.html" class="tab-item" data-tab="track">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-6"/></svg>
          <span class="tab-lbl">Track</span>
        </a>
        <a href="budget.html" class="tab-item" data-tab="budget">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span class="tab-lbl">Budget</span>
        </a>
        <a href="analytics.html" class="tab-item" data-tab="insights">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
          <span class="tab-lbl">Insights</span>
        </a>
        <a href="profile.html" class="tab-item" data-tab="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="tab-lbl">Profile</span>
        </a>
      </div>

      <!-- Add Meal Modal -->
      <div class="modal-overlay" id="mealModal">
        <div class="modal-card">
          <div class="row">
            <div class="h2">Add Planned Meal</div>
            <span onclick="closeAddMealModal()" style="cursor: pointer; font-size: 16px;">✕</span>
          </div>

          <div class="input-group">
            <label class="input-label">Meal Type</label>
            <select id="mealTypeInput" class="input-field">
              <option value="Breakfast">Breakfast 🌅</option>
              <option value="Lunch">Lunch ☀️</option>
              <option value="Dinner">Dinner 🌙</option>
            </select>
          </div>

          <div class="input-group">
            <label class="input-label">Meal Title</label>
            <input type="text" id="mealTitleInput" class="input-field" placeholder="e.g. Rice bowl & avocado">
          </div>

          <div class="input-group">
            <label class="input-label">Estimated Cost (฿)</label>
            <input type="number" step="1" id="mealCostInput" class="input-field mono" placeholder="50.00" value="50.00">
          </div>

          <button class="btn-grad" onclick="saveNewMeal()">+ Add to Meal Plan</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  let activeDay = 'Tue';

  function selectDay(day, el) {
    activeDay = day;
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderMealPlan();
  }

  function renderMealPlan() {
    const fullDayNames = {
      'Mon': 'Monday', 'Tue': 'Tuesday', 'Wed': 'Wednesday',
      'Thu': 'Thursday', 'Fri': 'Friday', 'Sat': 'Saturday', 'Sun': 'Sunday'
    };

    document.getElementById('dailyMealTitle').textContent = `${fullDayNames[activeDay]} meal budget`;
    document.getElementById('mealsDayTag').textContent = fullDayNames[activeDay];

    const dayMeals = MonevoStore.state.mealPlan.days[activeDay] || [];
    const dailyLimit = MonevoStore.state.mealPlan.dailyBudget || 15.00;
    const spentToday = dayMeals.reduce((acc, m) => acc + Number(m.cost), 0);
    const spentPct = Math.min(100, Math.round((spentToday / dailyLimit) * 100));

    document.getElementById('dailyMealRatio').textContent = `${MonevoUI.formatCurrency(spentToday)} / ${MonevoUI.formatCurrency(dailyLimit)}`;
    document.getElementById('dailyMealFill').style.width = `${spentPct}%`;

    const container = document.getElementById('mealsListContainer');
    let html = '';

    dayMeals.forEach((meal, idx) => {
      let icon = meal.icon || (meal.type === 'Breakfast' ? '🌅' : meal.type === 'Lunch' ? '☀️' : '🌙');
      html += `
        <div class="card card-sm" style="display: flex; align-items: center; gap: 10px;">
          <div class="icon-badge" style="background: var(--card-subtle);">${icon}</div>
          <div style="flex: 1;">
            <div style="font-size: 12px; font-weight: 700;">${meal.type} — ${meal.title}</div>
            <div class="sub-text">${meal.tag || 'Student Choice'}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="mono" style="font-size: 12px; font-weight: 700; color: var(--navy);">${MonevoUI.formatCurrency(meal.cost)}</span>
            <span onclick="removeMealItem(${idx})" style="cursor: pointer; opacity: 0.4; font-size: 14px;">✕</span>
          </div>
        </div>
      `;
    });

    if (dayMeals.length === 0) {
      html = `<div class="card card-sm sub-text" style="text-align: center; padding: 20px;">No meals planned yet for this day. Tap + to add one!</div>`;
    }

    container.innerHTML = html;
  }

  function removeMealItem(idx) {
    MonevoStore.deleteMealItem(activeDay, idx);
    MonevoUI.showToast('Meal removed from plan', '🗑️');
    renderMealPlan();
  }

  function openAddMealModal() {
    document.getElementById('mealModal').classList.add('open');
  }

  function closeAddMealModal() {
    document.getElementById('mealModal').classList.remove('open');
  }

  function saveNewMeal() {
    const type = document.getElementById('mealTypeInput').value;
    const title = document.getElementById('mealTitleInput').value.trim();
    const cost = parseFloat(document.getElementById('mealCostInput').value) || 0;

    if (!title) {
      MonevoUI.showToast('Please enter a meal title', '⚠️');
      return;
    }

    const icon = type === 'Breakfast' ? '🌅' : type === 'Lunch' ? '☀️' : '🌙';
    const newMeal = {
      type: type,
      title: title,
      cost: cost,
      icon: icon,
      tag: 'Custom Plan'
    };

    MonevoStore.addMealItem(activeDay, newMeal);
    closeAddMealModal();
    MonevoUI.showToast('Meal added to schedule!', '✓');
    renderMealPlan();
  }

  document.addEventListener('DOMContentLoaded', () => {
    MonevoUI.setupActiveTab('budget');
    renderMealPlan();
  });
</script>
</body>
</html>
