<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monevo — Budget Planner</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#12233F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monevo">
  <link rel="apple-touch-icon" href="../images/icon-192.png">
  <link rel="icon" type="image/png" href="../images/monevo-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-viewport">
  <div class="app-container" style="padding-top: 14px;">

      <!-- App Header -->
      <div class="app-header">
        <a href="dashboard.html" class="header-back">
          <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="header-title">Budget Planner</div>
        <div class="header-action" onclick="openBudgetModal()">✏️</div>
      </div>

      <div class="main-content">
        <!-- Circular Progress Ring Card -->
        <div class="card" style="text-align: center; padding: 18px 14px;">
          <svg width="120" height="120" viewBox="0 0 120 120" style="margin: 0 auto; display: block;">
            <defs>
              <linearGradient id="budgetRingGrad" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0%" stop-color="#2ECC71"/>
                <stop offset="100%" stop-color="#2E86DE"/>
              </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="50" stroke="var(--border-light)" stroke-width="12" fill="none"/>
            <circle id="budgetRingFill" cx="60" cy="60" r="50" stroke="url(#budgetRingGrad)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="115" transform="rotate(-90 60 60)" style="transition: stroke-dashoffset 0.6s ease;"/>
            <text id="budgetRingPct" x="60" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-size="18" font-weight="700" fill="currentColor">61%</text>
            <text x="60" y="72" text-anchor="middle" font-family="Inter" font-size="9" fill="var(--text-muted)">used this month</text>
          </svg>
          <div class="sub-text" style="margin-top: 10px;">
            Remaining <span class="mono" id="budgetRemainingDisplay" style="color: var(--text-main); font-weight: 700;">฿312.40</span> of <span id="budgetTotalDisplay">฿800.00</span>
          </div>
        </div>

        <!-- Proactive Alert Card -->
        <div class="card" id="budgetAlertCard" style="background: rgba(240, 169, 58, 0.12); border: 1px solid rgba(240, 169, 58, 0.35); padding: 12px 14px;">
          <div style="font-size: 11px; font-weight: 700; color: #B4700C; display: flex; align-items: center; gap: 6px;">
            <span>⚠️</span> Close to your Food limit
          </div>
          <div class="sub-text" style="margin-top: 3px; color: #8C5503;">
            You've spent 92% (฿138 / ฿150) of your monthly dining budget.
          </div>
        </div>

        <!-- Category Progress Breakdown -->
        <div class="row">
          <div class="h2">Category Allocations</div>
          <span class="sub-text">Monthly limit</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px;" id="categoryBudgetsContainer">
          <!-- Dynamically Rendered by JS -->
        </div>

        <button class="btn-secondary" onclick="openBudgetModal()" style="margin-top: 4px;">
          ⚙️ Adjust Monthly Limits
        </button>

      </div>

      <!-- Bottom Navigation Bar -->
      <div class="tabbar">
        <a href="dashboard.html" class="tab-item" data-tab="home">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span class="tab-lbl">Home</span>
        </a>
        <a href="expenses.html" class="tab-item" data-tab="track">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-6"/></svg>
          <span class="tab-lbl">Track</span>
        </a>
        <a href="budget.html" class="tab-item active" data-tab="budget">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span class="tab-lbl">Budget</span>
        </a>
        <a href="analytics.html" class="tab-item" data-tab="insights">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
          <span class="tab-lbl">Insights</span>
        </a>
        <a href="profile.html" class="tab-item" data-tab="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="tab-lbl">Profile</span>
        </a>
      </div>

      <!-- Edit Budget Modal -->
      <div class="modal-overlay" id="budgetModal">
        <div class="modal-card">
          <div class="row">
            <div class="h2">Adjust Total Monthly Budget</div>
            <span onclick="closeBudgetModal()" style="cursor: pointer; font-size: 16px;">✕</span>
          </div>
          <div class="input-group">
            <label class="input-label">Monthly Target (฿)</label>
            <input type="number" id="editBudgetInput" class="input-field mono" value="800.00">
          </div>
          <button class="btn-grad" onclick="saveNewBudget()">Save Budget</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  function renderBudgetPage() {
    const budgetState = MonevoStore.state.budgets;
    const total = budgetState.totalBudget || 800.00;
    const totalSpent = budgetState.categories.reduce((a, b) => a + Number(b.spent), 0);
    const remaining = Math.max(0, total - totalSpent);
    const pct = Math.min(100, Math.round((totalSpent / total) * 100));

    // Update Ring
    document.getElementById('budgetRingPct').textContent = `${pct}%`;
    const circumference = 314;
    const offset = circumference - (circumference * pct / 100);
    document.getElementById('budgetRingFill').setAttribute('stroke-dashoffset', offset);

    document.getElementById('budgetRemainingDisplay').textContent = MonevoUI.formatCurrency(remaining);
    document.getElementById('budgetTotalDisplay').textContent = MonevoUI.formatCurrency(total);

    // Render Categories
    const container = document.getElementById('categoryBudgetsContainer');
    let html = '';

    budgetState.categories.forEach(cat => {
      const catPct = Math.min(100, Math.round((cat.spent / cat.limit) * 100));
      let fillClass = '';
      if (catPct >= 90) fillClass = 'danger';
      else if (catPct >= 75) fillClass = 'warning';

      html += `
        <div class="card card-sm">
          <div class="row" style="margin-bottom: 6px;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span>${cat.icon || '🏷️'}</span>
              <span class="h2" style="font-size: 12px;">${cat.category}</span>
            </div>
            <span class="mono sub-text" style="font-weight: 700; color: var(--text-main);">
              ${MonevoUI.formatCurrency(cat.spent)} / ${MonevoUI.formatCurrency(cat.limit)}
            </span>
          </div>
          <div class="bar-track">
            <div class="bar-fill ${fillClass}" style="width: ${catPct}%;"></div>
          </div>
          <div class="row" style="margin-top: 4px;">
            <span class="sub-text" style="font-size: 9px;">${catPct}% consumed</span>
            <span class="sub-text" style="font-size: 9px; color: ${catPct >= 90 ? 'var(--coral)' : 'var(--text-muted)'}; font-weight: ${catPct >= 90 ? '700' : '500'};">
              ${catPct >= 90 ? 'Over limit risk' : 'Healthy'}
            </span>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function openBudgetModal() {
    document.getElementById('editBudgetInput').value = MonevoStore.state.budgets.totalBudget || 800.00;
    document.getElementById('budgetModal').classList.add('open');
  }

  function closeBudgetModal() {
    document.getElementById('budgetModal').classList.remove('open');
  }

  function saveNewBudget() {
    const val = parseFloat(document.getElementById('editBudgetInput').value);
    if (!val || val <= 0) {
      MonevoUI.showToast('Please enter a valid budget', '⚠️');
      return;
    }
    MonevoStore.state.budgets.totalBudget = val;
    MonevoStore.state.user.monthlyBudget = val;
    MonevoStore.saveState();
    closeBudgetModal();
    MonevoUI.showToast('Budget updated successfully!', '✓');
    renderBudgetPage();
  }

  document.addEventListener('DOMContentLoaded', () => {
    MonevoUI.setupActiveTab('budget');
    renderBudgetPage();
  });
</script>
</body>
</html>
