<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monevo — Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .cat-card {
      background: var(--card);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .cat-card.active {
      border-color: var(--blue);
      background: var(--grad-soft);
      transform: scale(1.02);
    }
    .cat-icon {
      font-size: 22px;
      margin-bottom: 4px;
    }
    .cat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
    }
  </style>
</head>
<body>

<div class="app-viewport">
  <div class="phone-shell">
    <div class="screen-container">
      <div class="notch"></div>
      
      <div class="statusbar">
        <span>9:41</span>
        <span>●●● 100%</span>
      </div>

      <!-- App Header -->
      <div class="app-header">
        <a href="dashboard.html" class="header-back">
          <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="header-title">Add Transaction</div>
        <div style="width: 36px;"></div>
      </div>

      <div class="main-content" style="gap: 14px;">
        <!-- Income vs Expense Switcher -->
        <div class="segmented-control">
          <div class="segmented-option" id="typeIncome" onclick="setTxType('income')">Income</div>
          <div class="segmented-option active" id="typeExpense" onclick="setTxType('expense')">Expense</div>
        </div>

        <!-- Big Amount Display -->
        <div class="card" style="text-align: center; padding: 18px 12px; background: var(--card-subtle);">
          <div class="sub-text" style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;">Amount ($)</div>
          <input type="number" step="0.01" id="txAmount" class="mono" value="8.40" style="font-size: 36px; font-weight: 700; text-align: center; width: 100%; color: var(--navy);" placeholder="0.00">
        </div>

        <!-- Title & Note -->
        <div class="input-group">
          <label class="input-label">Description / Merchant</label>
          <input type="text" id="txTitle" class="input-field" placeholder="e.g. Campus Diner, Bus Pass" value="Campus Diner">
        </div>

        <!-- Category Grid -->
        <div class="h2">Select Category</div>
        <div class="category-grid" id="categoryGrid">
          <div class="cat-card active" onclick="selectCategory('Food', '🍔', this)">
            <div class="cat-icon">🍔</div>
            <div class="cat-label">Food</div>
          </div>
          <div class="cat-card" onclick="selectCategory('Transport', '🚌', this)">
            <div class="cat-icon">🚌</div>
            <div class="cat-label">Transport</div>
          </div>
          <div class="cat-card" onclick="selectCategory('Rent', '🏠', this)">
            <div class="cat-icon">🏠</div>
            <div class="cat-label">Rent</div>
          </div>
          <div class="cat-card" onclick="selectCategory('Fun', '🎮', this)">
            <div class="cat-icon">🎮</div>
            <div class="cat-label">Fun</div>
          </div>
          <div class="cat-card" onclick="selectCategory('Books', '📚', this)">
            <div class="cat-icon">📚</div>
            <div class="cat-label">Books</div>
          </div>
          <div class="cat-card" onclick="selectCategory('Other', '➕', this)">
            <div class="cat-icon">➕</div>
            <div class="cat-label">Other</div>
          </div>
        </div>

        <!-- Primary Action -->
        <button class="btn-grad" onclick="saveTransaction()" style="margin-top: 4px;">
          ✓ Save Transaction
        </button>

        <!-- Past Transactions Accordion / Delete -->
        <div class="row" style="margin-top: 8px;">
          <div class="h2">Recent Logs</div>
          <span class="sub-text" id="logCount">6 items</span>
        </div>

        <div class="card" style="padding: 4px 12px; display: flex; flex-direction: column;" id="allTxList">
          <!-- Rendered by JS -->
        </div>

      </div>

      <!-- Bottom Navigation Bar -->
      <div class="tabbar">
        <a href="dashboard.html" class="tab-item" data-tab="home">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span class="tab-lbl">Home</span>
        </a>
        <a href="expenses.html" class="tab-item active" data-tab="track">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-6"/></svg>
          <span class="tab-lbl">Track</span>
        </a>
        <a href="budget.html" class="tab-item" data-tab="budget">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span class="tab-lbl">Budget</span>
        </a>
        <a href="analytics.html" class="tab-item" data-tab="insights">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
          <span class="tab-lbl">Insights</span>
        </a>
        <a href="profile.html" class="tab-item" data-tab="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="tab-lbl">Profile</span>
        </a>
      </div>

    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  let currentType = 'expense';
  let selectedCategoryName = 'Food';
  let selectedCategoryIcon = '🍔';

  function setTxType(type) {
    currentType = type;
    document.getElementById('typeIncome').classList.toggle('active', type === 'income');
    document.getElementById('typeExpense').classList.toggle('active', type === 'expense');

    if (type === 'income') {
      selectedCategoryName = 'Income';
      selectedCategoryIcon = '💰';
      document.getElementById('txTitle').value = 'Part-time Tutoring';
      document.getElementById('txAmount').value = '50.00';
    } else {
      selectedCategoryName = 'Food';
      selectedCategoryIcon = '🍔';
      document.getElementById('txTitle').value = 'Campus Diner';
      document.getElementById('txAmount').value = '8.40';
    }
  }

  function selectCategory(name, icon, el) {
    selectedCategoryName = name;
    selectedCategoryIcon = icon;
    document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  function saveTransaction() {
    const amount = parseFloat(document.getElementById('txAmount').value);
    const title = document.getElementById('txTitle').value.trim();

    if (!amount || isNaN(amount) || amount <= 0) {
      MonevoUI.showToast('Please enter a valid amount', '⚠️');
      return;
    }

    if (!title) {
      MonevoUI.showToast('Please enter a description', '⚠️');
      return;
    }

    const newTx = {
      title: title,
      type: currentType,
      category: selectedCategoryName,
      icon: selectedCategoryIcon,
      amount: amount,
      date: 'Just now'
    };

    MonevoStore.addTransaction(newTx);
    MonevoUI.showToast('Transaction saved successfully!', '✓');

    renderRecentList();
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 600);
  }

  function removeTransaction(id) {
    MonevoStore.deleteTransaction(id);
    MonevoUI.showToast('Transaction removed', '🗑️');
    renderRecentList();
  }

  function renderRecentList() {
    const list = document.getElementById('allTxList');
    const txs = MonevoStore.state.transactions;
    document.getElementById('logCount').textContent = `${txs.length} items`;

    let html = '';
    txs.forEach((tx, idx) => {
      const isExpense = tx.type === 'expense';
      const color = isExpense ? 'var(--coral)' : 'var(--green)';
      const sign = isExpense ? '-' : '+';
      const border = idx < txs.length - 1 ? 'border-bottom: 1px solid var(--border-light);' : '';

      html += `
        <div class="row" style="padding: 10px 0; ${border}">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="icon-badge" style="background: var(--card-subtle);">${tx.icon || '💸'}</div>
            <div>
              <div style="font-size: 12px; font-weight: 600;">${tx.title}</div>
              <div class="sub-text">${tx.category} · ${tx.date}</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="mono" style="font-size: 12px; font-weight: 700; color: ${color};">${sign}${MonevoUI.formatCurrency(tx.amount)}</span>
            <span onclick="removeTransaction('${tx.id}')" style="cursor: pointer; opacity: 0.4; font-size: 14px;">✕</span>
          </div>
        </div>
      `;
    });
    list.innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', () => {
    MonevoUI.setupActiveTab('track');
    renderRecentList();
  });
</script>
</body>
</html>
